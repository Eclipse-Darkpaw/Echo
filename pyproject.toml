[project]
name = "Echo"
version = "5.0.1"
description = "A collection of discord bots for moderation, reference sheet management, and scam prevention."
authors = [
    {name = "Autumn", email = "github-public@autumna1equin0x.pet"}
]
maintainers = [
    {name = "FoxyHunter", email = "fox@foxyhunter.be"},
    {name = "Autumn", email = "github-public@autumna1equin0x.pet"}
]
readme = "README.md"
requires-python = ">= 3.14"
dependencies = [
    "python-dotenv",
    "spacy",
    "watchdog",
    "filelock",
    "discord-py"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []